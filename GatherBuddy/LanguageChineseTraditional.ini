On timed nodes (unspoiled, legendary and ephemeral), keep gathering until the node runs out\nof integrity even after enough items have been gathered, instead of leaving right away.\nTheir gathering attempts do not come back, so leaving early throws them away.\nRegular nodes are not affected.==在限時採集點（未知、傳說、限時）上，即使已採集到足夠數量，也會繼續採集直到採集點耐久耗盡，\n而不是立刻離開。這些採集次數用掉就不會再回來，提早離開等於白白浪費。\n一般採集點不受影響。
