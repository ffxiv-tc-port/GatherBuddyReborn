Minimum collectability score to collect at the last integrity point (set to ?? to disable)==在最後一次耐久時採集所需的最低收藏品評分（設為 ?? 可停用）
Automatically decide what actions to use==自動決定使用哪些動作
This setting works differently depending on item or node type.\nFor collectables: the usual collectable rotation is used with all actions enabled.\nFor unspoiled and legendary nodes: actions are chosen to maximise the yield.\nFor regular nodes: actions are chosen to maximise the yield per GP spent.\n==此設定依物品或採集點類型而有不同效果。\n收藏品：使用常見的收藏品循環，啟用所有動作。\n未知與傳說採集點：選擇能將產量最大化的動作。\n一般採集點：選擇能將每 GP 產量最大化的動作。\n
Hold off spending GP until a node with the best bonuses==保留 GP，直到出現擁有最佳加成的採集點
This setting is for regular nodes only. When enabled, GP would be kept for nodes with bonuses\nthat would give the best possible yield per GP spent. Make sure that nodes with +2 integrity,\n+3 yield, and +100% boon chance hidden bonuses do exist, and you can meet their requirements.\nIt is ignored if ?? gives +3 bonus, because nothing can beat that.\nNot recommended if you have the Revisit trait (level 91+).==此設定僅適用於一般採集點。啟用時，會保留 GP 以等待能帶來最佳每 GP 產量加成的採集點。\n請確認擁有 +2 耐久、+3 產量、+100% 額外獎勵機率隱藏加成的採集點確實存在，且你能滿足其條件。\n若 ?? 給予 +3 加成則會忽略此設定，因為沒有更好的選擇了。\n若你擁有再訪特性（91 級以上），不建議啟用此設定。
