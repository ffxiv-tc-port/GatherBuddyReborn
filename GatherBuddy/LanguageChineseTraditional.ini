Hide Unavailable Fish in Fish Timer==在釣魚計時器中隱藏不可捕獲的魚
Hide all fish from the fish timer window that have have known requirements that are unfulfilled, like Fisher's Intuition or Snagging.==隱藏釣魚計時器視窗中，已知需求未滿足的所有魚，例如漁師之識或釣組。
Show Uptimes in Fish Timer==在釣魚計時器中顯示出現時間
Show the uptimes for restricted fish in the fish timer window.==在釣魚計時器視窗中顯示受限制魚類的出現時間。
Keep Fish Records==保留釣魚紀錄
Store Fish Records on your computer. This is necessary for bite timings for the fish timer window.==將釣魚紀錄儲存在你的電腦上。釣魚計時器視窗的咬鉤時間功能需要此設定。
Use Local Time in Records==在紀錄中使用本地時間
When displaying timestamps in the Fish Records Tab, use local time instead of Unix time.==在釣魚紀錄頁籤顯示時間戳記時，使用本地時間而非 Unix 時間。
Fish Timer Bite Time Scale==釣魚計時器咬鉤時間縮放
%2.3f Seconds==%2.3f 秒
The fishing timer window bite times are scaled to this value.\nIf your bite time exceeds the value, the progress bar and bite windows will not be displayed.\nYou should probably keep this as high as your highest bite window and as low as possible. About 40 seconds is usually enough.==釣魚計時器視窗的咬鉤時間會依此數值縮放。\n若你的咬鉤時間超過此數值，進度條與咬鉤區間將不會顯示。\n建議將此值設定得盡量高於你最長的咬鉤區間，同時盡量保持較低。通常 40 秒左右已足夠。
Fish Timer Interval Separators==釣魚計時器間隔分隔線
The fishing timer window can show a number of interval lines and corresponding seconds between 0 and 16.\nSet to 0 to turn this feature off.==釣魚計時器視窗可以顯示 0 到 16 條間隔線及對應秒數。\n設為 0 可關閉此功能。
Fish Timer Interval Rounding==釣魚計時器間隔秒數捨入位數
Round the displayed second value to this number of digits past the decimal. \nSet to 0 to display only whole numbers.==將顯示的秒數捨入到小數點後這麼多位數。\n設為 0 只顯示整數。
Hide Catch Popup==隱藏捕獲彈出視窗
Prevents the popup window that shows you your caught fish and its size, amount and quality from being shown.==阻止顯示捕獲魚類及其尺寸、數量與品質的彈出視窗。
Show Collectable Hints==顯示收藏品提示
Show if a fish is collectable in the fish timer window.==在釣魚計時器視窗中顯示魚是否為收藏品。
Show Multi Hook Hints==顯示多重提鉤提示
Show if a fish can be double or triple hooked in Cosmic Exploration.==顯示魚在宇宙探索中是否可雙重或三重提鉤捕獲。
Enable Fish Stats==啟用釣魚統計
New tab for aggregating and reporting fish stats based on local records. Currently in testing.==新增一個依本機紀錄彙整並產生釣魚統計報告的頁籤。目前為測試階段。
Copy Time Stats when reporting.==報告中包含時間統計
When copying the report, add min and max times to the report.==產生報告時，加入最短與最長咬鉤時間。
Copy Sizes Stats when reporting.==報告中包含尺寸統計
When copying the report, add min and max sizes to the report.==產生報告時，加入最小與最大尺寸。
Copy Multi Hook Stats when reporting.==報告中包含多重提鉤統計
When copying the report, add stats about multi-hook yields to the report.==產生報告時，加入多重提鉤產量的統計資料。
Enable Graphs.==啟用圖表
When viewing a fishing spot, enable visualization of fish report data. Extreme Testing!==檢視釣點時啟用釣魚報告資料視覺化。高度測試中！
Show Spearfishing Helper==顯示刺魚輔助工具
Toggle whether to show the Spearfishing Helper while spearfishing.==切換刺魚時是否顯示刺魚輔助工具。
Show Fish Name Overlay==顯示魚名疊層
Toggle whether to show the identified names of fish in the spearfishing window.==切換刺魚視窗中是否顯示已辨識魚的名稱。
Show List of Available Fish==顯示可捕獲魚類清單
Toggle whether to show the list of fish available in your current spearfishing spot on the side of the spearfishing window.==切換是否在刺魚視窗側邊顯示目前刺魚點可捕獲的魚類清單。
Show Speed of Fish in Overlay==在疊層中顯示魚的速度
Toggle whether to show the speed of fish in the spearfishing window in addition to their names.==切換是否在刺魚視窗中除了名稱外也顯示魚的速度。
Show Center Line==顯示中心線
Toggle whether to show a straight line up from the center of the spearfishing gig in the spearfishing window.==切換是否在刺魚視窗中從刺魚叉中心往上顯示一條直線。
Show Speed and Size as Text==以文字顯示速度與尺寸
Toggle whether to show the speed and size of available fish as text instead of icons.==切換是否以文字而非圖示顯示可捕獲魚類的速度與尺寸。
Show Fish Names in Fixed Position==在固定位置顯示魚名
Toggle whether to show the identified names of fish on the moving fish themselves or in a fixed position.==切換是否將已辨識魚的名稱顯示在移動中的魚本身上，或顯示在固定位置。
Fish Name Position Percentage==魚名位置百分比
Show Gather Window==顯示採集視窗
Show a small window with pinned Gatherables and their uptimes.==顯示一個小視窗，內含已釘選的採集物與其出現時間。
Anchor Gather Window to Bottom Left==將採集視窗錨定於左下角
Lets the Gather Window grow to the top and shrink from the top instead of the bottom.==讓採集視窗向上成長並從上方縮小，而非從下方。
Show Gather Window Timers==顯示採集視窗計時器
Show the uptimes for gatherables in the gather window.==在採集視窗中顯示採集物的出現時間。
Show Active Alarms in Gather Window==在採集視窗中顯示已啟用的提醒
Additionally show active alarms as a last gather window preset, obeying the regular rules for the window.==額外將已啟用的提醒顯示為採集視窗的最後一個預設，並遵循視窗的一般規則。
Sort Gather Window by Uptime==依出現時間排序採集視窗
Sort the items selected for the gather window by their uptimes.==將採集視窗中選取的物品依出現時間排序。
Show Only Available Items==僅顯示可用物品
Show only those items from your gather window setup that are currently available.==僅顯示採集視窗設定中目前可用的物品。
Hide Completed Items==隱藏已完成物品
Hide items that have the required inventory amount present in inventory.==隱藏物品欄中已有所需數量的物品。
Hide Gather Window in Duty==在任務中隱藏採集視窗
Hide the gather window when bound by any duty.==當受任何任務束縛時隱藏採集視窗。
Only Show Gather Window if Holding Key==僅在按住按鍵時顯示採集視窗
Only show the gather window if you are holding your selected key.==僅在你按住選定的按鍵時顯示採集視窗。
Hotkey to Hold==要按住的快捷鍵
Set the hotkey to hold to keep the window visible.==設定要按住以保持視窗顯示的快捷鍵。
Lock Gather Window Position==鎖定採集視窗位置
Prevent moving the gather window by dragging it around.==防止透過拖曳移動採集視窗。
Hotkey to Open Gather Window==開啟採集視窗快捷鍵
Set a hotkey to open the Gather Window.==設定用於開啟採集視窗的快捷鍵。
Hotkey to Open Main Interface==開啟主介面快捷鍵
Set a hotkey to open the main GatherBuddy interface.==設定用於開啟 GatherBuddy 主介面的快捷鍵。
Modifier to Delete Items on Right-Click==右鍵刪除物品所需修飾鍵
Set the modifier key to be used while right-clicking items in the gather window to delete them.==設定在採集視窗中右鍵點擊物品以刪除時所需的修飾鍵。
Prefer Cheaper Aetherytes==偏好較便宜的乙太之光
Prefer Less Travel Time==偏好較短的移動時間
Specify whether you prefer aetherytes that are closer to your target (less travel time) or aetherytes that are cheaper to teleport to when scanning through all available nodes for an item. Only matters if the item is not timed and has multiple sources.==設定在掃描某物品所有可用採集點時，你偏好距離目標較近（移動時間較短）的乙太之光，還是傳送費用較便宜的乙太之光。僅在該物品非限時且有多個來源時有意義。
Alarm Chat Format==提醒聊天訊息格式
Keep empty to have no chat output.\nCan replace:\n- {Alarm} with the alarm name in brackets.\n- {Item} with the item link.\n- {Offset} with the alarm offset in seconds.\n- {DurationString} with 'will be up for the next ...' or 'is currently up for ...'.\n- {Location} with the map flag link and location name.==留空則不輸出聊天訊息。\n可替換：\n- {Alarm} 為方括號中的提醒名稱。\n- {Item} 為物品連結。\n- {Offset} 為提醒偏移秒數。\n- {DurationString} 為「將於接下來...出現」或「目前出現中，持續...」。\n- {Location} 為地圖旗標連結與地點名稱。
Identified Gatherable Chat Format==已辨識採集物聊天訊息格式
Keep empty to have no chat output.\nCan replace:\n- {Input} with the entered search text.\n- {Item} with the item link.==留空則不輸出聊天訊息。\n可替換：\n- {Input} 為輸入的搜尋文字。\n- {Item} 為物品連結。
Always gather maps when available==有藏寶圖時優先採集
GBR will always grab maps first if it sees one in a node==GBR 若在採集點中看到藏寶圖，會永遠優先採集它
Config==設定
Set up your very own GatherBuddy to your meticulous specifications.\nIf you treat him well, he might even become a real boy.==按照你的細膩要求打造專屬於你的 GatherBuddy。\n只要好好對待他，他說不定會變成真正的男孩。
General==一般
Advanced==進階
Gather Command==採集指令
Set Names==套裝名稱
Miner==採掘師
Botanist==園藝師
Fisher==漁師
Messages==訊息
Interface==介面
Config Window==設定視窗
Fish Timer==釣魚計時器
Fish Stats [Testing]==釣魚統計〔測試中〕
Spearfishing Helper==刺魚輔助工具
Colors==顏色
Names in Chat==聊天室中的名稱
Commands in Chat==聊天室中的指令
Arguments in Chat==聊天室中的參數
Alarm Message in Chat==聊天室中的提醒訊息
Default==預設值
Can't find something?==找不到想要的東西嗎？
Click for some help navigating this table.\nControl + Shift + Right-Click to permanently hide this button.==點擊以取得瀏覽此表格的說明。\nCtrl + Shift + 右鍵點擊可永久隱藏此按鈕。
You can use text filters like "Item Name..." to only show entries that contain the given string. They are case-insensitive and are not stored for your next session.==可以使用「物品名稱…」之類的文字篩選，只顯示含有指定字串的項目。篩選不分大小寫，且不會保留到下次啟動。
Text filters also support regular expressions, e.g. "(blue|green)" matches all entries that contain either blue or green.==文字篩選也支援正規表示式，例如「(blue|green)」會比對出所有含有 blue 或 green 的項目。
Button filters like "Next Uptime", "Node Type" or "Fish Type" allow you to filter specific types on click.==「下次出現時間」、「採集點類型」或「魚種」這類按鈕篩選，可以點擊來篩選特定類型。
Those filters are stored across sessions. For columns with active filters, the filter buttons are tinted red.==這類篩選會跨啟動保留。有啟用篩選的欄位，其篩選按鈕會顯示紅色。
You can click in the blank space of a header to sort the table in this column, ascending or descending. This is signified with a little triangle pointing up or down.==點擊表頭的空白處，可依該欄遞增或遞減排序表格，並以朝上或朝下的小三角形表示。
You can right-click in the blank space of a header to open the table context menu, in which you can hide columns you are not interested in.==在表頭空白處按右鍵可開啟表格右鍵選單，在其中隱藏你不需要的欄位。
You can resize text columns by dragging the small separation markers of the column. It highlights the line in blue. Size is stored across sessions.==拖曳欄位間的小分隔標記可調整文字欄寬，分隔線會以藍色標示。欄寬會跨啟動保留。
You can reorder most columns by left-clicking in the blank space, holding the mouse button and dragging them. Ordering is stored across sessions.==在空白處按住滑鼠左鍵拖曳，即可調整大部分欄位的順序。順序會跨啟動保留。
You can right-click item names and a few other columns (like bait and fishing spot) to open further context menus with object-specific options.==在物品名稱與部分欄位（例如魚餜與釣點）上按右鍵，可開啟提供該對象專屬選項的右鍵選單。
You can also re-order the tabs themselves, though that is not stored across sessions.==分頁本身也可以調整順序，但這不會跨啟動保留。
Understood==我知道了
Click to enable/disable auto-gather==點擊以啟用／停用自動採集
Use to open the GatherBuddy interface.==用於開啟 GatherBuddy 介面。
Mark the nearest node containing the item supplied, teleport to the nearest aetheryte, equip appropriate gear.\nYou can use 'alarm' to gather the last triggered alarm or 'next' to gather the same item as before, but in the next-best location.==標記含有指定物品的最近採集點，傳送到最近的乙太之光，並換上合適的裝備。\n可使用 'alarm' 採集最後觸發的提醒，或使用 'next' 採集同一物品但改到次佳地點。
Mark the nearest botanist node containing the item supplied, teleport to the nearest aetheryte, equip appropriate gear.==標記含有指定物品的最近園藝師採集點，傳送到最近的乙太之光，並換上合適的裝備。
Mark the nearest miner node containing the item supplied, teleport to the nearest aetheryte, equip appropriate gear.==標記含有指定物品的最近採掘師採集點，傳送到最近的乙太之光，並換上合適的裝備。
Mark the nearest fishing spot containing the fish supplied, teleport to the nearest aetheryte and equip fishing gear.==標記含有指定魚類的最近釣點，傳送到最近的乙太之光，並換上釣魚裝備。
Teleport to the node of a group corresponding to current time. Use /gathergroup for more details.==傳送到採集群組中對應目前時間的採集點。輸入 /gathergroup 可查看更多說明。
Some quick toggles for config options. Use without argument for help.==設定選項的快速切換。不加參數執行可顯示說明。
Enable Anti-Stuck==啟用防卡死
Recover from being stuck with a short random movement. If that keeps failing and the character never leaves the area, an escalation action can be taken.==卡死時以短距離隨機位移嘗試脫困。若持續失敗且角色始終沒有離開該區域，可再執行升級措施。
Enable Local Recovery==啟用近端復原
Attempt a short random movement whenever vnavmesh appears to be stuck.==偵測到 vnavmesh 卡住時，嘗試短距離隨機位移。
Enable Escalation==啟用升級措施
Only after local recovery has failed the configured number of times does the area stagnation timer start. Disabled by default.==近端復原失敗達到設定次數後，才開始計算區域停滯時間。預設關閉。
Recovery Failures==復原失敗次數
How many local recoveries must fire before escalation is allowed at all.==至少觸發幾次近端復原後，才允許執行升級措施。
Stagnation Radius==停滯區域半徑
Leaving a circle of this radius counts as real progress and cancels the escalation.==離開此半徑範圍即視為有效進展，並取消升級措施。
Stagnation Time (seconds)==區域停滯時間（秒）
Do nothing==不執行
Force one unstuck movement==強制執行一次隨機位移脫困
Stop auto-gather==停止自動採集
Escalation Action==升級措施
What to do once the character has been stuck in the same area for the configured time.==角色在同一區域停滯達設定時間後要執行的動作。
Advanced##AntiStuckAdvanced==進階設定##AntiStuckAdvanced
Escalation Cooldown (seconds)==升級措施冷卻（秒）
Max Escalations Per Session==每次啟用上限
The budget is replenished every time auto-gather is turned on again.==每次重新啟用自動採集時，上限次數都會重置。
