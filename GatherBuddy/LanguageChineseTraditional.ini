With this enabled, whenever you catch a fish the data for that fish will be uploaded to a remote server\nThe purpose of this data collection is to allow for a usable auto-fishing feature to be built\nNo personal information about you or your character will be collected, only data relevant to the caught fish\nYou can opt-out again at any time by simply disabling this checkbox.==啟用後，每當你釣到魚，該魚的資料就會上傳到遠端伺服器\n此資料收集的目的是為了打造可用的自動釣魚功能\n不會收集任何關於你或你角色的個人資訊，只會收集與所捕獲魚類相關的資料\n你可以隨時停用此選項以取消加入。
